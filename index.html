
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ec4899">
  <link rel="manifest" href="./manifest.json">
  <title>Magic Bingo World</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Jua', sans-serif;
      background-color: #fdf2f8;
      overflow-x: hidden;
    }
    .bingo-cell-anim {
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .bingo-cell-anim:active {
      transform: scale(0.9);
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #fbcfe8;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f9a8d4;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-pink-50 text-gray-800">
  <div id="root"></div>
  <script>
    // Robust Service Worker registration for sandbox/preview environments
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => {
            console.log('Service Worker registered successfully');
          })
          .catch(err => {
            // Log as warning rather than error as SW often fails in sandboxed previews
            console.warn('Service Worker registration skipped or failed (common in development previews):', err.message);
          });
      });
    }
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
